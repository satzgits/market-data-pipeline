[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "market-data-pipeline"
version = "1.0.0"
description = "Real-time and historical market data ingestion from Binance and Alpha Vantage"
authors = [{name = "Savith Chandrahas"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "pandas>=2.0",
    "numpy>=1.24",
    "websocket-client>=1.6",
    "colorama>=0.4",
    "rich>=13.0",
]

[project.urls]
Repository = "https://github.com/satzgits/market-data-pipeline"

[tool.setuptools.packages.find]
include = ["pipeline*"]
